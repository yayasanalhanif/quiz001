<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Kuis Ad-Dhuha (Live)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --card:#161f36; --card2:#1c2745; --text:#eef2ff; --sub:#94a3c4;
    --accent:#6ee7b7; --accent2:#60a5fa; --warn:#fbbf24; --danger:#f87171; --border:#26325a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,#0b1226,#101a34 60%,#0b1226);
    color:var(--text); padding:32px 24px 60px;
  }
  .head{display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:24px;}
  h1{font-size:26px; margin:0 0 4px;}
  .sub{color:var(--sub); margin:0; font-size:13px;}
  .status-bar{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--sub);}
  .dot{width:8px;height:8px;border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);}
  .dot.loading{background:var(--warn); box-shadow:0 0 8px var(--warn); animation:pulse 1s infinite;}
  .dot.error{background:var(--danger); box-shadow:0 0 8px var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  button#refreshBtn{
    background:var(--card2); color:var(--text); border:1px solid var(--border);
    padding:7px 14px; border-radius:8px; cursor:pointer; font-size:12px;
  }
  button#refreshBtn:hover{border-color:var(--accent);}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:28px;}
  .kpi{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px;}
  .kpi .label{color:var(--sub); font-size:12px; text-transform:uppercase; letter-spacing:.06em;}
  .kpi .value{font-size:28px; font-weight:700; margin-top:6px;}
  .kpi.accent .value{color:var(--accent);}
  .kpi.blue .value{color:var(--accent2);}
  .kpi.warn .value{color:var(--warn);}
  .kpi.danger .value{color:var(--danger);}

  .charts{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-bottom:28px;}
  @media(max-width:900px){ .charts{grid-template-columns:1fr;} }
  .panel{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px;}
  .panel h2{font-size:15px; margin:0 0 14px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--border);}
  th{color:var(--sub); font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.04em;
     position:sticky; top:0; background:var(--card);}
  tr:hover td{background:var(--card2);}
  .badge{padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; display:inline-block;}
  .b-pemenang{background:rgba(110,231,183,.15); color:var(--accent);}
  .b-dinilai{background:rgba(96,165,250,.15); color:var(--accent2);}
  .b-habis{background:rgba(248,113,113,.15); color:var(--danger);}
  .b-mengerjakan{background:rgba(251,191,36,.15); color:var(--warn);}
  .b-belum{background:rgba(148,163,196,.15); color:var(--sub);}
  .rank{font-weight:700; color:var(--accent);}
  .table-wrap{max-height:520px; overflow:auto; border-radius:10px;}
  input[type=text]{
    width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border);
    background:#0e1730; color:var(--text); margin-bottom:12px; font-size:13px;
  }
  .errbox{
    background:rgba(248,113,113,.1); border:1px solid var(--danger); color:#fecaca;
    padding:14px 16px; border-radius:10px; margin-bottom:20px; font-size:13px; display:none;
  }
  footer{color:var(--sub); font-size:12px; margin-top:20px; text-align:center;}
</style>
</head>
<body>

<div class="head">
  <div>
    <h1>📊 Dashboard Kuis — Surat Ad-Dhuha</h1>
    <p class="sub">Sinkron otomatis</p>
  </div>
  <div class="status-bar">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Terhubung</span>
    <span id="lastSync"></span>
    <button id="refreshBtn">🔄 Refresh</button>
  </div>
</div>

<div class="errbox" id="errBox"></div>

<div class="kpi-grid" id="kpiGrid"></div>

<div class="charts">
  <div class="panel">
    <h2>🏆 Top 10 Skor Peserta</h2>
    <div class="errbox" id="chartWarn" style="display:none;"></div>
    <canvas id="topChart" height="260"></canvas>
  </div>
  <div class="panel">
    <h2>Distribusi Status Peserta</h2>
    <canvas id="statusChart" height="260"></canvas>
  </div>
</div>

<div class="panel">
  <h2>Daftar Lengkap Peserta</h2>
  <input type="text" id="search" placeholder="Cari nama atau ID peserta...">
  <div class="table-wrap">
    <table id="dataTable">
      <thead>
        <tr><th>Rank</th><th>ID</th><th>Nama</th><th>Waktu Mulai</th><th>Status</th><th>Total Skor</th><th>Durasi</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<footer>Total peserta: <span id="footTotal">-</span> · Auto-refresh setiap 30 detik</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbytMvaH3-zOmNn_BJtJ3ZOWzTdmWrLr0d7jEZs_uJAVvrh7p8bafPaUEvurr4q3sM3W/exec";

let currentData = [];
let topChart, statusChart;

function rowsToData(json){
  if(!json || !Array.isArray(json.data)) return [];
  return json.data
    .filter(r => r.ID)
    .map(r => ({
      id: r.ID || "",
      nama: r.Nama || "",
      waktu: r.WaktuMulai || "",
      status: r.Status || "",
      total: parseInt(r.Total) || 0,
      durasi: r.Duration && String(r.Duration).trim() ? String(r.Duration).trim() : "-",
      rank: r.WinnerRank ? parseInt(r.WinnerRank) : null,
    }));
}

function badgeClass(status){
  if(status==="Pemenang") return "b-pemenang";
  if(status==="Dinilai") return "b-dinilai";
  if(status==="WAKTU HABIS") return "b-habis";
  if(status==="MENGERJAKAN") return "b-mengerjakan";
  return "b-belum";
}

function renderAll(data){
  currentData = data;
  const total = data.length;
  const pemenang = data.filter(d=>d.status==="Pemenang").length;
  const dinilai = data.filter(d=>d.status==="Dinilai").length;
  const habis = data.filter(d=>d.status==="WAKTU HABIS").length;
  const mengerjakan = data.filter(d=>d.status==="MENGERJAKAN").length;
  const topScore = total ? Math.max(...data.map(d=>d.total)) : 0;

  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi accent"><div class="label">Total Peserta</div><div class="value">${total}</div></div>
    <div class="kpi accent"><div class="label">Pemenang</div><div class="value">${pemenang}</div></div>
    <div class="kpi blue"><div class="label">Sudah Dinilai</div><div class="value">${dinilai}</div></div>
    <div class="kpi warn"><div class="label">Sedang Mengerjakan</div><div class="value">${mengerjakan}</div></div>
    <div class="kpi danger"><div class="label">Waktu Habis</div><div class="value">${habis}</div></div>
    <div class="kpi"><div class="label">Skor Tertinggi</div><div class="value">${topScore}</div></div>
  `;
  document.getElementById('footTotal').textContent = total;

  // Render grafik secara terpisah — jika Chart.js gagal dimuat, dashboard tetap jalan
  try{
    if(typeof Chart === "undefined") throw new Error("Chart.js tidak termuat");

    const top10 = [...data].sort((a,b)=>b.total-a.total).slice(0,10);
    if(topChart) topChart.destroy();
    topChart = new Chart(document.getElementById('topChart'), {
      type:'bar',
      data:{ labels: top10.map(d=>d.nama), datasets:[{ label:'Skor', data: top10.map(d=>d.total), backgroundColor:'rgba(110,231,183,0.75)', borderRadius:6 }] },
      options:{ indexAxis:'y', plugins:{legend:{display:false}},
        scales:{ x:{grid:{color:'#26325a'}, ticks:{color:'#94a3c4'}}, y:{grid:{display:false}, ticks:{color:'#eef2ff'}} } }
    });

    const statusCounts = {Pemenang:pemenang, Dinilai:dinilai, "WAKTU HABIS":habis, MENGERJAKAN:mengerjakan};
    if(statusChart) statusChart.destroy();
    statusChart = new Chart(document.getElementById('statusChart'), {
      type:'doughnut',
      data:{ labels:Object.keys(statusCounts), datasets:[{ data:Object.values(statusCounts),
        backgroundColor:['#6ee7b7','#60a5fa','#f87171','#fbbf24'], borderColor:'#161f36', borderWidth:3 }] },
      options:{ plugins:{legend:{position:'bottom', labels:{color:'#eef2ff'}}} }
    });
    document.getElementById('chartWarn').style.display = 'none';
  } catch(chartErr){
    document.getElementById('chartWarn').style.display = 'block';
    document.getElementById('chartWarn').textContent = '⚠️ Grafik tidak dapat dimuat (' + chartErr.message + '), tapi data tabel di bawah tetap akurat.';
  }

  renderTable(data, document.getElementById('search').value);
}

function renderTable(rows, query){
  query = (query || "").toLowerCase();
  const filtered = rows.filter(d => d.nama.toLowerCase().includes(query) || d.id.toLowerCase().includes(query));
  const sorted = [...filtered].sort((a,b)=> b.total - a.total);
  document.getElementById('tbody').innerHTML = sorted.map(d=>`
    <tr>
      <td>${d.rank ? '<span class="rank">#'+d.rank+'</span>' : '-'}</td>
      <td>${d.id}</td>
      <td>${d.nama}</td>
      <td>${d.waktu}</td>
      <td><span class="badge ${badgeClass(d.status)}">${d.status}</span></td>
      <td><strong>${d.total}</strong></td>
      <td>${d.durasi}</td>
    </tr>
  `).join('');
}

document.getElementById('search').addEventListener('input', (e) => renderTable(currentData, e.target.value));

function setStatus(state, msg){
  const dot = document.getElementById('statusDot');
  dot.className = 'dot' + (state === 'loading' ? ' loading' : state === 'error' ? ' error' : '');
  document.getElementById('statusText').textContent = msg;
}

async function fetchData(){
  setStatus('loading', 'Menyinkronkan...');
  document.getElementById('errBox').style.display = 'none';
  try{
    const res = await fetch(API_URL, { cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if(json.error) throw new Error(json.error);
    const data = rowsToData(json);
    if(data.length === 0) throw new Error("Data kosong — cek nama tab atau isi Apps Script.");
    renderAll(data);
    setStatus('ok', 'Terhubung');
    document.getElementById('lastSync').textContent = '· terakhir sync ' + new Date().toLocaleTimeString('id-ID');
  } catch(err){
    setStatus('error', 'Gagal sinkron');
    const box = document.getElementById('errBox');
    box.style.display = 'block';
    box.textContent = 'Gagal mengambil data dari Apps Script: ' + err.message +
      '. Pastikan Web App sudah di-deploy dengan akses "Anyone".';
  }
}

document.getElementById('refreshBtn').addEventListener('click', fetchData);
fetchData();
setInterval(fetchData, 30000); // auto-refresh tiap 30 detik
</script>
</body>
</html>
